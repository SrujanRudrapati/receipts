name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      USE_LLM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
